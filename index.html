<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>現代戦ストラテジー（仮）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="map"></canvas>
    <header id="top"></header>
    <nav id="cats" aria-label="分野"></nav>
    <aside id="panel" class="panel hidden"></aside>
    <aside id="todo" class="hidden" aria-label="やること"></aside>
    <div id="tour" class="hidden"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="tips" aria-live="polite"></div>
    <div id="legend"></div>
    <div id="tools" role="toolbar" aria-label="表示"></div>
    <section id="nodePanel" class="panel hidden" aria-label="選んだ拠点"></section>
    <section id="strikeBar" aria-label="打撃予定"></section>
    <section id="mini" aria-label="全体地図">
      <canvas width="272" height="124"></canvas>
      <div class="zb">
        <button type="button" id="zin" aria-label="拡大">＋</button>
        <button type="button" id="zout" aria-label="縮小">−</button>
      </div>
    </section>
    <div id="hint" class="hidden"></div>
    <div id="modal" class="hidden"></div>
    <div id="loading">地図を読み込んでいます…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
